[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aif-memory"
version = "0.1.0"
description = "Agentic Identity Framework: a portable, append-only, self-describing personal memory that any AI model can read and extend."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Michael Kurilko" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["llm", "memory", "mcp", "personal-knowledge", "agents", "long-term-memory"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
tokens = ["tiktoken"]

[project.scripts]
aif = "aif.cli:main"

[tool.setuptools]
packages = ["aif"]
