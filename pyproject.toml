[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aif-memory"
version = "0.2.0"
description = "A personal memory you own, shared by every AI you use. Plain files, git-backed, MCP server included."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Michael Kurilko" }]
requires-python = ">=3.9"
dependencies = []
keywords = ["llm", "memory", "mcp", "model-context-protocol", "personal-knowledge", "agents",
            "long-term-memory", "claude", "chatgpt", "cursor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Mtkurilko/agentic-identity-framework"
Issues = "https://github.com/Mtkurilko/agentic-identity-framework/issues"
Specification = "https://github.com/Mtkurilko/agentic-identity-framework/blob/main/SPEC.md"

[project.optional-dependencies]
tokens = ["tiktoken"]

[project.scripts]
aif = "aif.cli:main"

[tool.setuptools]
packages = ["aif"]
